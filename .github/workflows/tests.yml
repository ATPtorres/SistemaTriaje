name: Tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mariadb:11.4
        env:
          MYSQL_ROOT_PASSWORD: testing-only
          MYSQL_DATABASE: triaje_test_ci
        ports: ['3306:3306']
        options: --health-cmd="mysqladmin ping -ptesting-only" --health-interval=10s --health-timeout=5s --health-retries=10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m pip install -r requirements-lock.txt
      - run: python -m pytest -q
      - run: node --test tests/frontend.test.cjs
      - run: python -m pytest tests/test_api.py -q
        env:
          TEST_MYSQL_URL: mysql+pymysql://root:testing-only@127.0.0.1:3306/triaje_test_ci
